<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WebCAD 2D</title>

<style>

.sel{margin:8px;padding:5px;background:var(--fd);border:1px solid var(--bd)}

.fr i{display:inline-block;width:12px;height:12px;border:1px solid #888;margin-right:6px;vertical-align:-2px}
.pb{margin:8px;padding:5px 12px;background:var(--ac);color:#fff}
#wr{flex:1;position:relative;min-width:0}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#vt{position:absolute;left:6px;top:4px;color:#cfd6dd;pointer-events:none}
#cl{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;width:min(640px,92%)}

#cr{display:flex;align-items:center;background:#b8bdc2;margin-top:3px;border:1px solid #666}#cr span{padding:2px 7px;color:#333;cursor:pointer}
#ci{flex:1;background:none;border:0;padding:5px;font:13px Consolas,monospace;color:#111}#ci::placeholder{color:#555;font-style:italic}
#sb{display:flex;align-items:center;gap:2px;background:var(--tp);padding:0 6px;height:28px;border-top:1px solid #11161b;padding-bottom:env(safe-area-inset-bottom,0)}

@media print{#app{display:none}#pimg{display:block;width:100%}}
@media (max-width:760px){#pal{display:none}}
</style></head><body>
<div id="app">
<div id="top"><b class="lg">W</b><button data-c="SAVE" title="Save">▣</button><button data-c="OPEN" title="Open">▥</button><button data-c="PLOT" title="Plot">⎙</button><button data-c="U" title="Undo">↶</button><button data-c="REDO" title="Redo">↷</button><span id="ti">WebCAD 2D &nbsp; Drawing1</span></div>

</div>

<script>
(()=>{
const $=s=>document.querySelector(s),TP=Math.PI*2,cv=$('#cv'),cx=cv.getContext('2d');
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const PAL=['#ff5d5d','#ffb347','#c58cff','#ff7ad9','#7ae0ff'],SZ={A5:[210,148],A4:[297,210],A3:[420,297],A2:[594,420],A1:[841,594],A0:[1189,841],'2A0':[1682,1189],'4A0':[2378,1682],B5:[250,176],B4:[353,250],B3:[500,353],B2:[707,500],B1:[1000,707],B0:[1414,1000],Letter:[279,216],Legal:[356,216],'Tabloid 11x17':[432,279],'ANSI C':[559,432],'ANSI D':[864,559],'ANSI E':[1118,864],'ARCH A':[305,229],'ARCH B':[457,305],'ARCH C':[610,457],'ARCH D':[914,610],'ARCH E1':[1067,762],'ARCH E':[1219,914]},STD=[1,2,5,10,20,25,50,75,100,125,150,200,250,500,1000,2000,5000];
let S={sh:[],ly:[{n:'0',c:'#ffffff'},{n:'Paredes',c:'#ffd23f'},{n:'Cotas',c:'#3fd97a'},{n:'Texto',c:'#4fc3f7'}],cl:0,ann:100,lay:{size:'A3',den:100,vc:null,proj:'',des:'',pr:'01',date:new Date().toLocaleDateString('pt-BR')}};
try{const j=localStorage.getItem('webcad');if(j)S=JSON.parse(j)}catch(e){}
let V={x:60,y:400,s:.1},mode='model',un=[],re=[],tool=null,sel=new Set(),cur={x:0,y:0},raw=cur,pan=null,box=null,last='',fl={grid:1,snap:0,ortho:0,os:1};
const log=t=>{const h=$('#hist');h.insertAdjacentHTML('beforeend','<div>'+String(t).replace(/</g,'&lt;')+'</div>');while(h.children.length>4)h.firstChild.remove()};
const save0=()=>{try{localStorage.setItem('webcad',JSON.stringify(S))}catch(e){}};
const push=()=>{un.push(JSON.stringify(S.sh));re=[];if(un.length>100)un.shift();save0()};
const undo=()=>{if(un.length){re.push(JSON.stringify(S.sh));S.sh=JSON.parse(un.pop());sel.clear();upd()}};
const redo=()=>{if(re.length){un.push(JSON.stringify(S.sh));S.sh=JSON.parse(re.pop());sel.clear();upd()}};
const add=s=>{push();s.l=S.cl;if(s.t==='dim')s.k=S.ann;S.sh.push(s)};
/* geometry */
const ap=(s,a)=>({x:s.c.x+s.r*Math.cos(a),y:s.c.y+s.r*Math.sin(a)}),wd=s=>((s.a1-s.a0)%TP+TP)%TP;
function dg(s){const L=d(s.a,s.b)||1,u={x:(s.b.x-s.a.x)/L,y:(s.b.y-s.a.y)/L},n={x:-u.y,y:u.x},o=(s.o.x-s.a.x)*n.x+(s.o.y-s.a.y)*n.y;return{L,u,n,o,A:{x:s.a.x+n.x*o,y:s.a.y+n.y*o},B:{x:s.b.x+n.x*o,y:s.b.y+n.y*o}}}
function kp(s){switch(s.t){case'line':return[s.a,s.b,mid(s.a,s.b)];case'pl':{const r=[...s.p];for(let i=0;i<s.p.length-(s.cl?0:1);i++)r.push(mid(s.p[i],s.p[(i+1)%s.p.length]));return r}
case'circle':return[s.c,{x:s.c.x+s.r,y:s.c.y},{x:s.c.x-s.r,y:s.c.y},{x:s.c.x,y:s.c.y+s.r},{x:s.c.x,y:s.c.y-s.r}];
case'arc':return[s.c,ap(s,s.a0),ap(s,s.a1),ap(s,s.a0+wd(s)/2)];case'text':return[s.p];case'dim':return[s.a,s.b];case'hatch':return kp(s.b)}return[]}
function ds(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function dist(p,s){switch(s.t){case'line':return ds(p,s.a,s.b);
case'pl':{let m=1e18;for(let i=0;i<s.p.length-(s.cl?0:1);i++)m=Math.min(m,ds(p,s.p[i],s.p[(i+1)%s.p.length]));return m}
case'circle':return Math.abs(d(p,s.c)-s.r);
case'arc':{const q=((ang(s.c,p)-s.a0)%TP+TP)%TP;return q<=wd(s)?Math.abs(d(p,s.c)-s.r):Math.min(d(p,ap(s,s.a0)),d(p,ap(s,s.a1)))}
case'text':return p.x>=s.p.x&&p.x<=s.p.x+s.tx.length*s.h*.6&&p.y>=s.p.y&&p.y<=s.p.y+s.h?0:1e18;
case'dim':{const g=dg(s);return Math.min(ds(p,g.A,g.B),ds(p,s.a,g.A),ds(p,s.b,g.B))}case'hatch':return dist(p,s.b)}return 1e18}
const hitAt=w=>{for(let i=S.sh.length-1;i>=0;i--)if(dist(w,S.sh[i])<8/V.s)return i;return -1};
function bb(s){const k=kp(s);let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;k.forEach(q=>{x0=Math.min(x0,q.x);x1=Math.max(x1,q.x);y0=Math.min(y0,q.y);y1=Math.max(y1,q.y)});if(s.r){x0=Math.min(x0,s.c.x-s.r);x1=Math.max(x1,s.c.x+s.r);y0=Math.min(y0,s.c.y-s.r);y1=Math.max(y1,s.c.y+s.r)}return{x0,y0,x1,y1}}
function ext(){let r={x0:1e18,y0:1e18,x1:-1e18,y1:-1e18};S.sh.forEach(s=>{const b=bb(s);r={x0:Math.min(r.x0,b.x0),y0:Math.min(r.y0,b.y0),x1:Math.max(r.x1,b.x1),y1:Math.max(r.y1,b.y1)}});return r.x0>r.x1?{x0:0,y0:0,x1:1e4,y1:7e3}:r}
const rect=(a,b)=>({t:'pl',p:[a,{x:b.x,y:a.y},b,{x:a.x,y:b.y}],cl:1});
function arc3(a,b,c){const D=2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y));if(Math.abs(D)<1e-9)return null;const q=p=>p.x*p.x+p.y*p.y,o={x:(q(a)*(b.y-c.y)+q(b)*(c.y-a.y)+q(c)*(a.y-b.y))/D,y:(q(a)*(c.x-b.x)+q(b)*(a.x-c.x)+q(c)*(b.x-a.x))/D},ccw=(b.x-a.x)*(c.y-b.y)-(b.y-a.y)*(c.x-b.x)>0;return{t:'arc',c:o,r:d(o,a),a0:ang(o,ccw?a:c),a1:ang(o,ccw?c:a)}}
/* transforms */
const trf=(dx,dy)=>({p:q=>({x:q.x+dx,y:q.y+dy})});
const rotf=(c,a)=>({rot:a,p:q=>{const x=q.x-c.x,y=q.y-c.y,co=Math.cos(a),si=Math.sin(a);return{x:c.x+x*co-y*si,y:c.y+x*si+y*co}}});
const scf=(c,k)=>({sc:k,p:q=>({x:c.x+(q.x-c.x)*k,y:c.y+(q.y-c.y)*k})});
const mirf=(a,b)=>{const t=ang(a,b),co=Math.cos(t),si=Math.sin(t);return{mir:t,p:q=>{const x=q.x-a.x,y=q.y-a.y,pr=x*co+y*si;return{x:a.x+2*pr*co-x,y:a.y+2*pr*si-y}}}};
function xf(s,f){if(s.t==='hatch')return{...s,b:xf(s.b,f)};const o=JSON.parse(JSON.stringify(s));['a','b','o','c'].forEach(k=>{if(o[k])o[k]=f.p(o[k])});if(o.p)o.p=Array.isArray(o.p)?o.p.map(f.p):f.p(o.p);
if(f.sc){if(o.r)o.r*=f.sc;if(o.h)o.h*=f.sc;if(o.k)o.k*=f.sc}
if(o.t==='arc'){if(f.mir!=null){const a=o.a0;o.a0=2*f.mir-o.a1;o.a1=2*f.mir-a}else{o.a0+=f.rot||0;o.a1+=f.rot||0}}return o}
function offs(s,n,p){if(s.t==='line'){const L=d(s.a,s.b),u={x:-(s.b.y-s.a.y)/L,y:(s.b.x-s.a.x)/L},g=((p.x-s.a.x)*u.x+(p.y-s.a.y)*u.y)>=0?n:-n,v={x:u.x*g,y:u.y*g};return{...s,a:{x:s.a.x+v.x,y:s.a.y+v.y},b:{x:s.b.x+v.x,y:s.b.y+v.y}}}
const r=d(p,s.c)>s.r?s.r+n:s.r-n;return r>0?{...s,r}:null}
/* drawing */
function dimDraw(c,s,T){const g=dg(s),X=q=>q.x*T.s+T.x,Y=q=>-q.y*T.s+T.y,e=(g.o>=0?1:-1)*s.k*1.25,t=s.k*.75,sg=(p,q)=>{c.moveTo(X(p),Y(p));c.lineTo(X(q),Y(q))},{u,n,A,B}=g;
c.beginPath();sg(s.a,{x:A.x+n.x*e,y:A.y+n.y*e});sg(s.b,{x:B.x+n.x*e,y:B.y+n.y*e});sg(A,B);
[A,B].forEach(P=>sg({x:P.x-(u.x+n.x)*t,y:P.y-(u.y+n.y)*t},{x:P.x+(u.x+n.x)*t,y:P.y+(u.y+n.y)*t}));c.stroke();
let a=Math.atan2(u.y,u.x);if(Math.abs(a)>Math.PI/2)a+=Math.PI;const m=mid(A,B);c.save();c.translate(X(m),Y(m));c.rotate(-a);c.font=2.5*s.k*T.s+'px Arial';c.textAlign='center';c.fillText(Math.round(g.L),0,-s.k*.7*T.s);c.restore()}
function path(c,s,T){const X=q=>q.x*T.s+T.x,Y=q=>-q.y*T.s+T.y;c.beginPath();
switch(s.t){case'line':c.moveTo(X(s.a),Y(s.a));c.lineTo(X(s.b),Y(s.b));break;
case'pl':s.p.forEach((q,i)=>i?c.lineTo(X(q),Y(q)):c.moveTo(X(q),Y(q)));if(s.cl)c.closePath();break;
case'circle':c.arc(X(s.c),Y(s.c),s.r*T.s,0,TP);break;case'arc':c.arc(X(s.c),Y(s.c),s.r*T.s,-s.a0,-s.a1,true);break;
case'text':c.font=s.h*T.s+'px Arial';c.textAlign='left';c.fillText(s.tx,X(s.p),Y(s.p));return;case'dim':dimDraw(c,s,T);return;
case'hatch':{c.save();c.beginPath();if(s.b.t==='circle')c.arc(X(s.b.c),Y(s.b.c),s.b.r*T.s,0,TP);else s.b.p.forEach((q,i)=>i?c.lineTo(X(q),Y(q)):c.moveTo(X(q),Y(q)));c.clip();const e=bb(s.b),hh=e.y1-e.y0;c.beginPath();for(let v=e.x0-hh;v<=e.x1;v+=s.sp){c.moveTo(X({x:v}),Y({y:e.y0}));c.lineTo(X({x:v+hh}),Y({y:e.y1}))}c.stroke();c.restore();return}}c.stroke()}
const gs=()=>{let g=10;while(g*V.s<10)g*=5;return g};
function grid(W,H){const g=gs();cx.lineWidth=1;const x0=Math.floor(-V.x/V.s/g),x1=Math.ceil((W-V.x)/V.s/g),y0=Math.floor(-(H-V.y)/V.s/g),y1=Math.ceil(V.y/V.s/g);
if(fl.grid)for(let i=x0;i<=x1;i++){cx.strokeStyle=i%5?'#14181d':'#1d232a';cx.beginPath();cx.moveTo(i*g*V.s+V.x,0);cx.lineTo(i*g*V.s+V.x,H);cx.stroke()}
if(fl.grid)for(let i=y0;i<=y1;i++){cx.strokeStyle=i%5?'#14181d':'#1d232a';cx.beginPath();cx.moveTo(0,V.y-i*g*V.s);cx.lineTo(W,V.y-i*g*V.s);cx.stroke()}
cx.globalAlpha=.7;cx.strokeStyle='#d33';cx.beginPath();cx.moveTo(0,V.y);cx.lineTo(W,V.y);cx.stroke();cx.strokeStyle='#2c3';cx.beginPath();cx.moveTo(V.x,0);cx.lineTo(V.x,H);cx.stroke();cx.globalAlpha=1}
function prev(){if(!tool||tool.ph!=='go')return;const t=tool,p=cur,P=t.pts,l=P[P.length-1];let a=[];if(!l)return;
switch(t.nm){case'LINE':case'MIRROR':case'ROTATE':a=[{t:'line',a:l,b:p}];break;case'PLINE':a=[{t:'line',a:l,b:p}];if(P.length>1)a.push({t:'pl',p:P});break;
case'CIRCLE':a=[{t:'circle',c:l,r:d(l,p)}];break;case'RECTANG':a=[rect(l,p)];break;
case'ARC':a=P.length===1?[{t:'line',a:l,b:p}]:[arc3(P[0],P[1],p)].filter(Boolean);break;
case'DIM':a=P.length===1?[{t:'line',a:l,b:p}]:[{t:'dim',a:P[0],b:P[1],o:p,k:S.ann}];break;
case'MOVE':case'COPY':a=[...sel].map(i=>xf(S.sh[i],trf(p.x-P[0].x,p.y-P[0].y)));break}
cx.setLineDash([4,4]);cx.strokeStyle=cx.fillStyle='#ccc';cx.lineWidth=1;a.forEach(s=>path(cx,s,V));cx.setLineDash([])}
function sheet(c,pm,ox,oy){const[pw,ph]=SZ[S.lay.size],L=S.lay,X=v=>ox+v*pm,Y=v=>oy+v*pm,tb=30;c.fillStyle='#fff';c.fillRect(X(0),Y(0),pw*pm,ph*pm);c.strokeStyle='#000';c.lineWidth=Math.max(1,.5*pm);c.strokeRect(X(20),Y(10),(pw-30)*pm,(ph-20)*pm);
const vx=X(20),vy=Y(10),vw=(pw-30)*pm,vh=(ph-20-tb)*pm,k=pm/L.den,T={s:k,x:vx+vw/2-L.vc.x*k,y:vy+vh/2+L.vc.y*k};
c.save();c.beginPath();c.rect(vx,vy,vw,vh);c.clip();c.strokeStyle=c.fillStyle='#000';c.lineWidth=Math.max(1,.25*pm);S.sh.forEach(s=>path(c,s,T));c.restore();
c.lineWidth=Math.max(1,.35*pm);c.strokeRect(vx,vy,vw,vh);let x=vx;
[['Projeto',L.proj,.4],['Desenho',L.des,.2],['Prancha',L.pr,.1],['Escala','1:'+L.den,.15],['Data',L.date,.15]].forEach(([a,b,w])=>{const cw=vw*w;c.strokeRect(x,vy+vh,cw,tb*pm);c.fillStyle='#555';c.font=2.2*pm+'px Arial';c.textAlign='left';c.fillText(a,x+pm,vy+vh+4*pm);c.fillStyle='#000';c.font=4.5*pm+'px Arial';c.fillText(b,x+pm,vy+vh+18*pm,cw-2*pm);x+=cw})}
function draw(){const W=cv.clientWidth,H=cv.clientHeight;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
if(mode==='layout'){cx.fillStyle='#1d242c';cx.fillRect(0,0,W,H);const[pw,ph]=SZ[S.lay.size],pm=Math.min((W-50)/pw,(H-50)/ph);sheet(cx,pm,(W-pw*pm)/2,(H-ph*pm)/2);return}
